<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
</head>
<body>

    <h1>Student Marks Calculator</h1>

    <label>Obtained Marks:</label>
    <input type="number" id="obtained">

    <br><br>

    <label>Total Marks:</label>
    <input type="number" id="total">

    <br><br>

    <button onclick="calculate()">Calculate Percentage</button>

    <h2 id="result"></h2>

    <script>
        function calculate() {
            let obtained = document.getElementById("obtained").value;
            let total = document.getElementById("total").value;

            let percentage = (obtained / total) * 100;

            document.getElementById("result").innerHTML =
                "Your Percentage is: " + percentage.toFixed(2) + "%";
        }
    </script>

</body>
</html>
