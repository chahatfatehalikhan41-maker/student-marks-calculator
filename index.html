<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Required Marks Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #222;
    }

    p {
      text-align: center;
      color: #666;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      border-radius: 8px;
      background: #eef6ff;
      text-align: center;
      font-weight: bold;
      color: #174ea6;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Required Marks Calculator</h1>

    <p>Calculate how many marks you need to achieve your target percentage.</p>

    <label>Total Marks</label>
    <input type="number" id="totalMarks" placeholder="e.g. 600">

    <label>Current Marks</label>
    <input type="number" id="currentMarks" placeholder="e.g. 350">

    <label>Target Percentage (%)</label>
    <input type="number" id="targetPercentage" placeholder="e.g. 60">

    <button onclick="calculateMarks()">Calculate</button>

    <div id="result"></div>

  </div>

  <script>
    function calculateMarks() {

      let total = Number(document.getElementById("totalMarks").value);
      let current = Number(document.getElementById("currentMarks").value);
      let target = Number(document.getElementById("targetPercentage").value);

      let result = document.getElementById("result");

      if (total <= 0 || current < 0 || target <= 0) {
        result.style.display = "block";
        result.innerHTML = "Please enter valid numbers.";
        return;
      }

      let required = (total * target / 100) - current;

      result.style.display = "block";

      if (required <= 0) {
        result.innerHTML = "🎉 You have already achieved your target percentage!";
      } else if (required > total - current) {
        result.innerHTML = "❌ This target is not possible with the remaining marks.";
      } else {
        result.innerHTML =
          "You need <strong>" + Math.ceil(required) +
          " more marks</strong> to reach " + target + "%.";
      }
    }
  </script>

</body>
</html>
